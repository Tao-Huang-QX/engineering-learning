[project]
name = "book-rag"
version = "0.1.0"
description = "RAG over a PDF book - LlamaIndex core, Docling parsing, pgvector store, LangGraph orchestration"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.7",
    "llama-index-core>=0.12",
    "llama-index-embeddings-huggingface>=0.4",
    "llama-index-vector-stores-postgres>=0.3",
    "llama-index-llms-openai>=0.3",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
