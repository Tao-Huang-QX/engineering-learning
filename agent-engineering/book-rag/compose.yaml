services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: book-rag-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_rag
    ports:
      - "5433:5432"
    volumes:
      - book_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  book_rag_pgdata:
